[project]
name = "sphinx-c-autodoc"
version = "1.7.0"
description = "A sphinx autodoc extension for c modules"
authors = [
    {name="Nick"}
]
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Sphinx :: Extension",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "sphinx>=4.0",
    "clang>=12",
    "beautifulsoup4",
]
[project.urls]
repository = "https://github.com/speedyleion/sphinx-c-autodoc"
documentation = "https://sphinx-c-autodoc.readthedocs.io/en/latest/"

[project.scripts]
sphinx-c-apidoc = 'sphinx_c_autodoc.apidoc:main'

[tool.uv]
exclude-newer = "14 days"
# Work around bug where uv would drop current time in lock file 
required-version = ">=0.11.8"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "B",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "RUF",
    "W",
]
ignore = ["E111", "E114", "E117", "W191"]

[tool.ruff.lint.pylint]
max-args = 10

[dependency-groups]
dev = [
    "ruff==0.16.2",
    "ty==0.0.63",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "sphinxcontrib-autoprogram==0.1.9",
    "types-docutils==0.22.3.20260724",
    "furo>=2024.0.0",
    "sphinx>=8.2 ; python_full_version >= '3.11'",
    "tox==4.58.0",
    "tox-uv==1.36.0",
]

[build-system]
requires = ["flit_core ==3.12.0"]
build-backend = "flit_core.buildapi"
